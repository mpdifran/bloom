<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Health & Wellness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 26.67%;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .download-link {
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .download-link:hover {
            transform: translateY(-2px);
            opacity: 0.85;
        }

        .download-link:active {
            transform: translateY(0);
        }

        .download-badge {
            height: 50px;
            width: auto;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .app-icon {
                width: 100px;
                height: 100px;
            }

            .download-badge {
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/app-icon.png" alt="Bloom App Icon" class="app-icon">
        <h1>Bloom</h1>
        <p>Your comprehensive health and wellness companion</p>
        <a href="https://apps.apple.com/app/apple-store/id6739955926?pt=127532637&ct=universal-link-landing-page&mt=8" class="download-link">
            <img src="/en-us.svg" alt="Download on the App Store" class="download-badge">
        </a>
    </div>
</body>
</html>
