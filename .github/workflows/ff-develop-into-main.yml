name: Fast-forward develop into main (daily)

on:
  schedule:
    # 6:00 EST every day
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  ff:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward main to develop if possible
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main develop

          git checkout main
          git reset --hard origin/main

          # Is main already up to date?
          if git merge-base --is-ancestor origin/develop origin/main; then
            echo "main already contains develop. Nothing to do."
            exit 0
          fi

          # Can main be fast-forwarded to develop?
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "Fast-forwarding main -> develop..."
            git merge --ff-only origin/develop
            git push origin main
            echo "Done."
          else
            echo "ERROR: main and develop have diverged; cannot fast-forward."
            echo "Fix by merging/rebasing develop onto main (or vice versa) intentionally."
            exit 1
          fi
